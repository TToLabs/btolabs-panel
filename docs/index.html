<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Panel BTo Innova</title>
<!--
  Panel interno de BTo Innova (solo lectura).
  - Los datos viven en datos.json. La web y la APK los leen al abrir: un cambio publicado se ve al instante sin reinstalar.
  - En la APK se piden a la URL publicada (DATOS_REMOTOS); si no hay red, se usa la última copia guardada o la que viene dentro de la app.
  - Sin contraseñas: el estado de los accesos se describe, nunca se guardan claves.
  - Descargas: PDF con la vista de impresión del navegador y CSV. En la APK abren la versión web en el navegador del teléfono.
-->
<style>
:root{color-scheme:light;--bg:#ffffff;--card:#ffffff;--ink:#14213d;--muted:#5f6b7a;--line:#dfe3e8;--acc:#1b3a6b;--acc2:#eef2f7;
  --ok:#2f6f4f;--okb:#edf5f0;--mid:#8a6a1f;--midb:#f8f3e6;--bad:#9b2c2c;--badb:#f8eded;--side:#f7f8fa;--sidet:#3b4757}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 "Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--acc)}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--sidet);border-right:1px solid var(--line);padding:24px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.marca{display:flex;gap:10px;align-items:center;font-weight:700;font-size:16px;color:var(--ink);margin:0 10px 4px;line-height:1.25}
.marca img{width:44px;height:auto;flex:none}
.marca small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.grupo-menu{margin:18px 12px 6px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.menu{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:2px}
.menu button{all:unset;box-sizing:border-box;width:100%;display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:4px;border-left:3px solid transparent;cursor:pointer;font-weight:600;font-size:14px}
.menu button:hover{background:var(--acc2);color:var(--ink)}
.menu button[aria-current="page"]{background:var(--acc2);color:var(--acc);border-left-color:var(--acc)}
.menu button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.side .pie{margin:24px 12px 0;font-size:12px;color:var(--muted)}
main{padding:28px clamp(16px,3vw,40px) 48px;min-width:0}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
h1{font-size:clamp(22px,2.6vw,28px);line-height:1.2;margin:0;font-weight:700;letter-spacing:-.01em;color:var(--acc)}
.top{border-bottom:2px solid var(--acc);padding-bottom:14px}
.sub{color:var(--muted);margin:6px 0 0;font-size:14px}
.acciones{display:flex;gap:8px;flex-wrap:wrap}
.btn{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:4px;font-weight:600;font-size:14px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:20px;min-width:0}
.card h2{font-size:13px;margin:0 0 14px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.card h3{font-size:15px;margin:16px 0 8px}
.kpi{border-top:3px solid var(--acc)}
.kpi b{display:block;font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1;color:var(--ink)}
.kpi span{color:var(--muted);font-size:13px}
.nota{display:inline-grid;place-items:center;width:52px;height:52px;border-radius:4px;font-weight:700;font-size:19px;flex:none;border:1px solid currentColor}
.bien{color:var(--ok);background:var(--okb)}.medio{color:var(--mid);background:var(--midb)}.mal{color:var(--bad);background:var(--badb)}
.chip{display:inline-block;padding:1px 8px;border-radius:3px;font-size:12px;font-weight:700}
.fila{display:flex;gap:14px;align-items:center}
.barra{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:4px}
.barra i{display:block;height:100%;border-radius:99px}
.metr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;font-size:14px;margin:0}
.metr dt{color:var(--muted)}.metr dd{margin:0;font-weight:700;text-align:right}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tabla{overflow-x:auto}
ul.lista{margin:0;padding-left:18px;display:grid;gap:6px}
.vacio{color:var(--muted);font-style:italic}
tr.off{opacity:.45}
.chk{width:18px;height:18px;accent-color:var(--acc)}
.tot{font-size:26px;font-weight:700;color:var(--acc)}
.aviso{border-left:3px solid var(--acc);background:var(--acc2);padding:12px 14px;border-radius:3px;font-size:14px;margin-bottom:16px}
.pend{color:var(--muted);font-weight:600}
.solo-print{display:none}
.estado{padding:40px;text-align:center;color:var(--muted)}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;top:0;z-index:5;height:auto;padding:12px 12px 8px;padding-top:max(12px,env(safe-area-inset-top));border-right:0;border-bottom:1px solid var(--line)}
  .grupo-menu{display:none}
  .side .pie{display:none}
  .marca{font-size:16px;margin:0 4px}
  .menu{grid-auto-flow:column;grid-auto-columns:max-content;overflow-x:auto;margin-top:10px;padding-bottom:4px;scrollbar-width:none}
  .menu button{padding:8px 12px;border-left:0;border-bottom:2px solid transparent;border-radius:0}
  .menu button[aria-current="page"]{border-bottom-color:var(--acc)}
  main{padding-top:20px}
}
@media print{
  @page{size:letter;margin:16mm}
  body{background:#fff;color:#000;font-size:12px}
  .side,.acciones,.no-print{display:none!important}
  .app{display:block}
  main{padding:0}
  .card{border-color:#ccc}
  tr.off{display:none}   /* el PDF muestra solo lo que se eligió */
  .kpi,.fila,.metr,tr,li{break-inside:avoid}   /* las tarjetas altas pueden partirse; sus filas no */
  .solo-print{display:block}
  .portada{border-bottom:2px solid #1f4e9c;padding-bottom:10px;margin-bottom:16px}
  a{color:#000;text-decoration:none}
}
</style>
</head>
<body>
<div class="app">
  <nav class="side" aria-label="Secciones">
    <p class="marca"><img src="img/logo-grupovl.png" alt="Grupo VL"><span>Grupo VL<small>Diagnóstico digital · preparado por BTo Innova</small></span></p>
    <ul class="menu" id="menu"></ul>
    <p class="pie" id="pie"></p>
  </nav>
  <main id="main" tabindex="-1"><p class="estado">Cargando datos…</p></main>
</div>
<script>
(function () {
  'use strict';
  var DATOS_REMOTOS = 'https://ttolabs.github.io/btolabs-panel/datos.json';
  var WEB = 'https://ttolabs.github.io/btolabs-panel/';
  // La versión vive en DOS lugares y se sube en cada APK nueva: aquí (la que trae la app) y en docs/version.json (la publicada).
  var APP_VERSION = 4;
  var VERSION_URL = 'https://ttolabs.github.io/btolabs-panel/version.json';
  var esApp = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());

  // localStorage puede lanzar SecurityError en algunos WebView: siempre envuelto
  function leerLocal(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } }
  function guardarLocal(k, v) { try { window.localStorage.setItem(k, v); } catch (e) { /* sin caché */ } }

  var SECCIONES = [
    { id: 'inicio', nombre: 'Resumen ejecutivo', grupo: 'Informe para gerencia' },
    { id: 'webs', nombre: 'Webs', grupo: 'Informe para gerencia' },
    { id: 'linkedin', nombre: 'LinkedIn', grupo: 'Informe para gerencia' },
    { id: 'plan', nombre: 'Plan de mejora', grupo: 'Informe para gerencia' },
    { id: 'presupuesto', nombre: 'Presupuesto por ítem', grupo: 'Informe para gerencia' },
    { id: 'informes', nombre: 'Descargas', grupo: 'Informe para gerencia' },
    { id: 'accesos', nombre: 'Accesos', grupo: 'Uso interno' },
    { id: 'confirmar', nombre: 'Por confirmar', grupo: 'Uso interno' }
  ];
  var D = null, actual = 'inicio';

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function clase(n) { return n == null ? '' : n >= 90 ? 'bien' : n >= 50 ? 'medio' : 'mal'; }
  function color(n) { return n >= 90 ? 'var(--ok)' : n >= 50 ? 'var(--mid)' : 'var(--bad)'; }
  function notaWeb(s) {
    var m = s.lighthouse && s.lighthouse.celular; if (!m) return null;
    return Math.round((m.rendimiento + m.seo + m.accesibilidad + m.buenas_practicas) / 4);
  }
  function fmtFecha(f) { if (!f) return '—'; var p = f.split('-'); return p.length === 3 ? p[2] + '-' + p[1] + '-' + p[0] : f; }
  function v(x) { return x == null || x === '' ? '<span class="pend">Pendiente</span>' : esc(x); }

  /* ---------- Carga de datos: remoto → caché → incluido en la app ---------- */
  function cargar() {
    var url = (esApp ? DATOS_REMOTOS : 'datos.json') + '?t=' + Date.now();
    return fetch(url, { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (j) { guardarLocal('panel-datos', JSON.stringify(j)); return j; })
      .catch(function () {
        var c = leerLocal('panel-datos');
        if (c) { try { return JSON.parse(c); } catch (e) {} }
        return fetch('datos.json').then(function (r) { return r.json(); });   // copia incluida en la APK
      });
  }

  /* ---------- Vistas ---------- */
  function cabecera(titulo, sub, conDescarga) {
    return '<div class="solo-print portada"><img src="img/logo-grupovl.png" alt="" style="height:40px;vertical-align:middle;margin-right:10px"><b>Grupo VL · Diagnóstico digital</b><br>' + esc(titulo) + ' · datos al ' + fmtFecha(D.actualizado) + ' · preparado por BTo Innova, Soluciones Tecnológicas</div>' +
      '<div class="top"><div><h1>' + esc(titulo) + '</h1><p class="sub">' + sub + '</p></div>' +
      (conDescarga ? '<div class="acciones"><button class="btn" data-accion="pdf">Descargar PDF</button><button class="btn" data-accion="csv">Descargar CSV</button></div>' : '') + '</div>';
  }

  function vInicio() {
    var notas = D.sitios.map(notaWeb).filter(function (n) { return n != null; });
    var prom = notas.length ? Math.round(notas.reduce(function (a, b) { return a + b; }, 0) / notas.length) : null;
    var rend = D.sitios.map(function (s) { return s.lighthouse && s.lighthouse.celular ? s.lighthouse.celular.rendimiento : null; }).filter(function (n) { return n != null; });
    var sinH1 = D.sitios.filter(function (s) { return s.seo && s.seo.h1 === 0; }).length;
    var h = cabecera('Resumen ejecutivo', 'Línea base (mes cero) de las webs y redes del grupo, medida antes de empezar. Datos al ' + fmtFecha(D.actualizado) + '.', true);
    h += '<div class="grid g4">' +
      '<div class="card kpi"><b>' + (prom == null ? '—' : prom) + '<small style="font-size:15px;color:var(--muted)"> /100</small></b><span>Nota promedio de las webs (celular)</span></div>' +
      '<div class="card kpi"><b>' + (rend.length ? Math.min.apply(null, rend) + '–' + Math.max.apply(null, rend) : '—') + '</b><span>Rendimiento en celular (de 100)</span></div>' +
      '<div class="card kpi"><b>' + sinH1 + ' de ' + D.sitios.length + '</b><span>Portadas sin título principal (H1)</span></div>' +
      '<div class="card kpi"><b>' + esc((D.linkedin[0] || {}).seguidores || '—') + '</b><span>Seguidores del grupo en LinkedIn</span></div></div>';
    h += '<div class="grid g2" style="margin-top:16px"><div class="card"><h2>Nota por web</h2>' + D.sitios.map(function (s) {
      var n = notaWeb(s);
      return '<div class="fila" style="margin-bottom:12px"><span class="nota ' + clase(n) + '">' + (n == null ? '—' : n) + '</span><div style="min-width:0;flex:1"><b>' + esc(s.nombre) + '</b> <span class="sub" style="margin:0">' + esc(s.url) + '</span><div class="barra"><i style="width:' + (n || 0) + '%;background:' + color(n || 0) + '"></i></div></div></div>';
    }).join('') + '<p class="sub">Promedio de rendimiento, SEO, accesibilidad y buenas prácticas de Lighthouse en celular.</p></div>';
    h += '<div class="card"><h2>Falencias principales</h2><ul class="lista">' + D.falencias.map(function (f) { return '<li>' + esc(f) + '</li>'; }).join('') + '</ul></div></div>';
    h += '<div class="card" style="margin-top:16px"><h2>Lo que mediremos con acceso</h2><div class="tabla"><table><thead><tr><th>Indicador</th><th>Fuente</th><th>Hoy</th></tr></thead><tbody>' +
      D.requiere_acceso.map(function (r) { return '<tr><td>' + esc(r.indicador) + '</td><td>' + esc(r.fuente) + '</td><td class="pend">Requiere acceso</td></tr>'; }).join('') + '</tbody></table></div></div>';
    return h;
  }

  function vWebs() {
    var h = cabecera('Webs', 'Velocidad y calidad (Lighthouse), SEO básico y contenido desactualizado de cada sitio.', true);
    h += '<p class="aviso">Lighthouse mide en laboratorio, simulando un celular con red lenta. Sirve para comparar entre webs y contra el mes siguiente; el valor exacto varía algo entre corridas.</p>';
    h += '<div class="grid g2">' + D.sitios.map(function (s) {
      var n = notaWeb(s), L = s.lighthouse || {}, c = '';
      ['celular', 'escritorio'].forEach(function (modo) {
        var m = L[modo];
        c += '<h3>' + (modo === 'celular' ? 'Celular' : 'Escritorio') + '</h3>';
        if (!m) { c += '<p class="vacio">Sin medición.</p>'; return; }
        c += '<dl class="metr">' + [['Rendimiento', m.rendimiento], ['SEO', m.seo], ['Accesibilidad', m.accesibilidad], ['Buenas prácticas', m.buenas_practicas]].map(function (x) {
          return '<dt>' + x[0] + '</dt><dd><span class="chip ' + clase(x[1]) + '">' + x[1] + '</span></dd>';
        }).join('') + '<dt>Carga del elemento principal</dt><dd>' + m.lcp_s + ' s</dd><dt>Peso de la página</dt><dd>' + m.peso_mb + ' MB</dd></dl>';
      });
      var seo = s.seo || {};
      c += '<h3>SEO y contenido</h3><dl class="metr">' +
        '<dt>Título principal (H1)</dt><dd>' + (seo.h1 ? 'Sí' : '<span class="chip mal">No tiene</span>') + '</dd>' +
        '<dt>Descripción para Google</dt><dd>' + (seo.meta_description ? 'Sí' : '<span class="chip mal">No tiene</span>') + '</dd>' +
        '<dt>Imágenes sin texto alternativo</dt><dd>' + v(seo.imgs_sin_alt) + ' de ' + v(seo.imgs) + '</dd>' +
        '<dt>Última noticia publicada</dt><dd>' + (s.contenido && s.contenido.ultima_entrada ? fmtFecha(s.contenido.ultima_entrada) : '<span class="chip mal">Ninguna</span>') + '</dd></dl>';
      if (s.hallazgos && s.hallazgos.length) c += '<h3>Hallazgos</h3><ul class="lista">' + s.hallazgos.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>';
      return '<div class="card"><div class="fila"><span class="nota ' + clase(n) + '">' + (n == null ? '—' : n) + '</span><div><h2 style="margin:0">' + esc(s.nombre) + '</h2><a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.url) + '</a></div></div>' + c + '</div>';
    }).join('') + '</div>';
    return h;
  }

  function vLinkedin() {
    var h = cabecera('LinkedIn', 'Datos públicos de cada página. Los cuenta Alberto con su sesión; las estadísticas internas requieren rol de administrador.', true);
    h += '<div class="card tabla"><table><thead><tr><th>Página</th><th>Seguidores</th><th>Empleados en LinkedIn</th><th>Última publicación</th><th>Publicaciones (3 meses)</th><th>Interacción (últimas 5)</th></tr></thead><tbody>' +
      D.linkedin.map(function (l) {
        return '<tr><td><a href="' + esc(l.url) + '" target="_blank" rel="noopener">' + esc(l.pagina) + '</a></td><td>' + v(l.seguidores) + '</td><td>' + v(l.empleados) + '</td><td>' + (l.ultima_publicacion ? fmtFecha(l.ultima_publicacion) : v(null)) + '</td><td>' + v(l.publicaciones_3m) + '</td><td>' + v(l.interaccion_ultimas5) + '</td></tr>';
      }).join('') + '</tbody></table></div>';
    h += '<div class="card" style="margin-top:16px"><h2>Cómo contarlo</h2><ol class="lista">' + D.guia_linkedin.map(function (p) { return '<li>' + esc(p) + '</li>'; }).join('') + '</ol></div>';
    return h;
  }

  function vAccesos() {
    var h = cabecera('Accesos', 'Estado de cada acceso. Nunca se guardan contraseñas: Grupo VL agrega la cuenta de Alberto con el rol indicado.', true);
    h += '<div class="card tabla"><table><thead><tr><th>Plataforma</th><th>Empresa</th><th>Estado</th><th>Rol pedido</th><th>Cuenta usada</th><th>Notas</th></tr></thead><tbody>' +
      D.accesos.map(function (a) {
        var cl = a.estado === 'Concedido' ? 'bien' : a.estado === 'Pedido' ? 'medio' : 'mal';
        return '<tr><td><b>' + esc(a.plataforma) + '</b></td><td>' + esc(a.empresa) + '</td><td><span class="chip ' + cl + '">' + esc(a.estado) + '</span></td><td>' + esc(a.rol) + '</td><td>' + v(a.cuenta) + '</td><td>' + esc(a.notas || '') + '</td></tr>';
      }).join('') + '</tbody></table></div>';
    return h;
  }

  function vConfirmar() {
    var h = cabecera('Por confirmar en la reunión', 'Datos que Grupo VL debe confirmar antes de publicar nada.', true);
    h += '<div class="grid g2">' + D.confirmar.map(function (g) {
      return '<div class="card"><h2>' + esc(g.grupo) + '</h2><ol class="lista">' + g.items.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ol></div>';
    }).join('') + '</div>';
    return h;
  }

  function vPlan() {
    var P = D.plan;
    var h = cabecera('Plan de mejora', 'Qué se encontró, qué lo causa y cómo se soluciona. Hallazgos verificados el ' + fmtFecha(P.verificado) + '.', true);
    h += '<p class="aviso">' + esc(P.aviso) + '</p>';
    h += '<div class="grid g2"><div class="card"><h2>Lo que encontramos</h2><ul class="lista">' + P.hallazgos.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div>' +
      '<div class="card"><h2>Orden recomendado</h2><ol class="lista">' + P.fases.map(function (f) { return '<li><b>' + esc(f.nombre) + ':</b> ' + esc(f.texto) + '</li>'; }).join('') + '</ol><p class="sub" style="margin-top:12px">' + esc(P.medicion) + '</p></div></div>';
    h += '<div class="card tabla" style="margin-top:16px"><h2>Problemas y soluciones</h2><table><thead><tr><th>Fase</th><th>Problema</th><th>Qué lo causa</th><th>Solución</th><th>Se necesita</th><th>Esfuerzo (estimado)</th></tr></thead><tbody>' +
      P.filas.map(function (f) { return '<tr><td><b>' + esc(f.fase) + '</b></td><td>' + esc(f.problema) + '</td><td>' + esc(f.causa) + '</td><td>' + esc(f.solucion) + '</td><td>' + esc(f.necesita) + '</td><td>' + esc(f.esfuerzo) + '</td></tr>'; }).join('') + '</tbody></table></div>';
    var K = P.costos;
    h += '<div class="grid g2" style="margin-top:16px"><div class="card"><h2>Costo para Grupo VL · honorarios</h2><p>' + esc(K.honorarios.texto) + '</p>' +
      '<div class="tabla"><table><thead><tr><th>Concepto</th><th>Incluye</th><th>Valor</th></tr></thead><tbody>' +
      K.honorarios.filas.map(function (f) { return '<tr><td><b>' + esc(f.concepto) + '</b></td><td>' + esc(f.incluye) + '</td><td>' + esc(f.valor) + '</td></tr>'; }).join('') + '</tbody></table></div>' +
      '<p class="sub" style="margin-top:12px"><b>Ejemplo:</b> ' + esc(K.honorarios.ejemplo) + '</p></div>' +
      '<div class="card"><h2>Costo para Grupo VL · herramientas de terceros</h2><div class="tabla"><table><thead><tr><th>Herramienta</th><th>Precio</th><th>Nota</th></tr></thead><tbody>' +
      K.terceros.map(function (x) { return '<tr><td><b>' + esc(x.herramienta) + '</b><br><span class="sub">' + esc(x.uso) + '</span></td><td>' + esc(x.precio) + '</td><td>' + esc(x.nota) + '</td></tr>'; }).join('') + '</tbody></table></div></div></div>' +
      '<p class="aviso" style="margin-top:16px">' + esc(K.nota) + '</p>';
    return h;
  }

  /* ---------- Presupuesto por ítem: la gerencia marca lo que quiere; el total se calcula en pantalla ---------- */
  var SEL = {};
  function clp(n) { return '$' + String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
  var COLS = [['grupovl', 'Grupo VL'], ['suat', 'SUAT'], ['tresur', 'Tresur'], ['maquinfra', 'Maquinfra'], ['transversal', 'Todo el grupo']];
  function actualizarTotal() {
    var tot = 0, n = 0, col = {};
    COLS.forEach(function (c) { col[c[0]] = 0; });
    D.plan.presupuesto.items.forEach(function (it) {
      var on = SEL[it.id] !== false;
      if (on) { tot += it.precio; n++; COLS.forEach(function (c) { col[c[0]] += it.reparto[c[0]]; }); }
      var fila = document.querySelector('tr[data-fila="' + it.id + '"]'); if (fila) fila.classList.toggle('off', !on);
      var c = document.querySelector('input[data-pid="' + it.id + '"]'); if (c) c.checked = on;
    });
    var a = document.getElementById('pres-tot'), b = document.getElementById('pres-n');
    if (a) a.textContent = clp(tot); if (b) b.textContent = n + ' de ' + D.plan.presupuesto.items.length + ' ítems elegidos';
    COLS.forEach(function (c) { var e = document.getElementById('pres-c-' + c[0]); if (e) e.textContent = clp(col[c[0]]); });
    var e2 = document.getElementById('pres-c-total'); if (e2) e2.textContent = clp(tot);
  }
  function vPresupuesto() {
    var P = D.plan.presupuesto;
    var h = cabecera('Presupuesto por ítem', esc(P.texto), true);
    h += '<p class="aviso"><b>' + esc(P.estado) + '.</b> ' + esc(P.nota) + '</p>';
    h += '<div class="acciones no-print" style="margin-bottom:12px"><button class="btn pri" type="button" data-pkg="todo">Elegir todo</button>' +
      P.paquetes.map(function (p, i) { return '<button class="btn" type="button" data-pkg="' + i + '">Solo ' + esc(p.nombre) + '</button>'; }).join('') + '</div>';
    var cel = function (v) { return '<td style="white-space:nowrap;text-align:right">' + (v ? clp(v) : '—') + '</td>'; };
    h += '<div class="card tabla"><table><thead><tr><th class="no-print">Elegir</th><th>Fase</th><th>Ítem</th><th>Qué incluye</th><th>Total del grupo</th>' +
      COLS.map(function (c) { return '<th style="text-align:right">' + esc(c[1]) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      P.items.map(function (it) {
        return '<tr data-fila="' + it.id + '"><td class="no-print"><input class="chk" type="checkbox" data-pid="' + it.id + '" aria-label="Elegir ' + esc(it.titulo) + '" checked></td><td>' + esc(it.fase) + '</td><td><b>' + esc(it.titulo) + '</b></td><td>' + esc(it.incluye) + '</td><td style="white-space:nowrap"><b>' + clp(it.precio) + '</b></td>' +
          COLS.map(function (c) { return cel(it.reparto[c[0]]); }).join('') + '</tr>';
      }).join('') + '</tbody><tfoot><tr><td class="no-print"></td><td colspan="3"><b>Total elegido</b></td><td style="white-space:nowrap"><b id="pres-c-total"></b></td>' +
      COLS.map(function (c) { return '<td style="white-space:nowrap;text-align:right"><b id="pres-c-' + c[0] + '"></b></td>'; }).join('') + '</tr></tfoot></table></div>';
    h += '<div class="card" style="margin-top:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;justify-content:space-between"><div><h2 style="margin:0 0 4px">Total para todo el grupo</h2><span id="pres-n" class="sub"></span></div><span id="pres-tot" class="tot"></span></div>';
    return h;
  }

  function vInformes() {
    var h = cabecera('Descargas', 'Cada sección en PDF (hoja carta) o sus datos en CSV para Excel. Las de uso interno no se entregan al cliente.', false);
    h += '<div class="grid g2">' + SECCIONES.filter(function (s) { return s.id !== 'informes'; }).map(function (s) {
      return '<div class="card"><h2>' + esc(s.nombre) + ' · ' + esc(s.grupo) + '</h2><div class="acciones"><button class="btn pri" data-accion="pdf" data-seccion="' + s.id + '">PDF</button><button class="btn" data-accion="csv" data-seccion="' + s.id + '">CSV</button></div></div>';
    }).join('') + '</div>';
    if (esApp) h += '<p class="sub" style="margin-top:16px">En la app, las descargas abren la versión web en el navegador del teléfono.</p>';
    return h;
  }

  var VISTAS = { inicio: vInicio, webs: vWebs, linkedin: vLinkedin, plan: vPlan, presupuesto: vPresupuesto, accesos: vAccesos, confirmar: vConfirmar, informes: vInformes };

  /* ---------- CSV por sección ---------- */
  function filasCSV(id) {
    if (id === 'inicio' || id === 'webs') return [['Web', 'URL', 'Nota', 'Rend. celular', 'SEO celular', 'Accesib. celular', 'Buenas prácticas celular', 'Rend. escritorio', 'H1', 'Descripción Google', 'Última noticia']].concat(D.sitios.map(function (s) {
      var c = (s.lighthouse || {}).celular || {}, e = (s.lighthouse || {}).escritorio || {};
      return [s.nombre, s.url, notaWeb(s), c.rendimiento, c.seo, c.accesibilidad, c.buenas_practicas, e.rendimiento, (s.seo || {}).h1 ? 'Sí' : 'No', (s.seo || {}).meta_description ? 'Sí' : 'No', (s.contenido || {}).ultima_entrada || 'Ninguna'];
    }));
    if (id === 'linkedin') return [['Página', 'URL', 'Seguidores', 'Empleados', 'Última publicación', 'Publicaciones 3 meses', 'Interacción últimas 5']].concat(D.linkedin.map(function (l) { return [l.pagina, l.url, l.seguidores, l.empleados, l.ultima_publicacion, l.publicaciones_3m, l.interaccion_ultimas5]; }));
    if (id === 'presupuesto') return [['Fase', 'Ítem', 'Qué incluye', 'Total del grupo (CLP)', 'Grupo VL', 'SUAT', 'Tresur', 'Maquinfra', 'Todo el grupo', 'Elegido']].concat(D.plan.presupuesto.items.map(function (it) { return [it.fase, it.titulo, it.incluye, it.precio, it.reparto.grupovl, it.reparto.suat, it.reparto.tresur, it.reparto.maquinfra, it.reparto.transversal, SEL[it.id] === false ? 'No' : 'Sí']; }));
    if (id === 'plan') return [['Fase', 'Problema', 'Qué lo causa', 'Solución', 'Se necesita', 'Esfuerzo (estimado)']].concat(D.plan.filas.map(function (f) { return [f.fase, f.problema, f.causa, f.solucion, f.necesita, f.esfuerzo]; }), [[]], [['Costo de terceros', 'Uso', 'Precio', 'Nota']], D.plan.costos.terceros.map(function (x) { return [x.herramienta, x.uso, x.precio, x.nota]; }));
    if (id === 'accesos') return [['Plataforma', 'Empresa', 'Estado', 'Rol', 'Cuenta', 'Notas']].concat(D.accesos.map(function (a) { return [a.plataforma, a.empresa, a.estado, a.rol, a.cuenta, a.notas]; }));
    if (id === 'confirmar') { var f = [['Grupo', 'Dato a confirmar']]; D.confirmar.forEach(function (g) { g.items.forEach(function (x) { f.push([g.grupo, x]); }); }); return f; }
    return [];
  }
  function descargarCSV(id) {
    var txt = filasCSV(id).map(function (f) { return f.map(function (c) { c = c == null ? '' : String(c); return /[";\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c; }).join(';'); }).join('\r\n');
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['﻿' + txt], { type: 'text/csv;charset=utf-8' }));   // BOM: Excel lee bien las tildes
    a.download = 'grupovl-' + id + '-' + D.actualizado + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
  }

  function accion(tipo, id) {
    id = id || actual;
    if (esApp) { window.open(WEB + '?s=' + id + '&' + tipo + '=1', '_system'); return; }   // la WebView no imprime ni descarga
    if (tipo === 'csv') { descargarCSV(id); return; }
    if (id !== actual) mostrar(id);
    setTimeout(function () { window.print(); }, 50);
  }

  /* ---------- Navegación ---------- */
  function mostrar(id) {
    if (!VISTAS[id]) id = 'inicio';
    actual = id;
    document.getElementById('main').innerHTML = VISTAS[id]();
    [].forEach.call(document.querySelectorAll('#menu button'), function (b) { b.setAttribute('aria-current', b.dataset.s === id ? 'page' : 'false'); });
    document.title = SECCIONES.filter(function (s) { return s.id === id; })[0].nombre + ' · Panel BTo Innova';
    if (id === 'presupuesto') actualizarTotal();
    try { history.replaceState(null, '', '?s=' + id); } catch (e) {}
  }

  // Menú agrupado: lo que se muestra a la gerencia, separado de lo de uso interno
  document.getElementById('menu').innerHTML = SECCIONES.map(function (s, i) {
    var titulo = (i === 0 || SECCIONES[i - 1].grupo !== s.grupo) ? '<li class="grupo-menu" aria-hidden="true">' + s.grupo + '</li>' : '';
    return titulo + '<li><button type="button" data-s="' + s.id + '">' + s.nombre + '</button></li>';
  }).join('');
  document.getElementById('menu').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    mostrar(b.dataset.s); document.getElementById('main').focus({ preventScroll: true }); window.scrollTo(0, 0);
    if (b.scrollIntoView) b.scrollIntoView({ block: 'nearest', inline: 'center' });
  });
  document.getElementById('main').addEventListener('click', function (e) {
    var b = e.target.closest('[data-accion]'); if (b) accion(b.dataset.accion, b.dataset.seccion);
  });

  /* ---------- Actualizador: compara la versión publicada con la de esta app ---------- */
  function chequearActualizacion() {
    if (!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform())) return Promise.resolve();
    return fetch(VERSION_URL + '?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (v) {
      if (v && v.version > APP_VERSION) mostrarActualizacion(v);
    }).catch(function () { /* sin internet: se vuelve a chequear al abrir la app */ });
  }
  function mostrarActualizacion(v) {
    if (document.getElementById('aviso-actualizacion')) return;
    var b = document.createElement('div');
    b.id = 'aviso-actualizacion'; b.className = 'no-print';
    b.setAttribute('role', 'alert');
    b.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--acc);color:#fff;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px';
    b.innerHTML = '<span style="flex:1;min-width:200px"><b>Hay una versión nueva del panel.</b> ' + esc(v.novedades || '') + '</span>' +
      '<button type="button" data-a="ok" style="all:unset;cursor:pointer;background:#fff;color:var(--acc);font-weight:700;padding:8px 14px;border-radius:4px">Actualizar</button>' +
      '<button type="button" data-a="no" style="all:unset;cursor:pointer;padding:8px 10px;text-decoration:underline">Más tarde</button>';
    b.addEventListener('click', function (e) {
      var a = e.target.getAttribute && e.target.getAttribute('data-a'); if (!a) return;
      if (a === 'no') { b.remove(); return; }
      var btn = e.target; btn.textContent = 'Descargando…';
      var fin = function () { btn.textContent = 'Actualizar'; };
      var P = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.ApkInstalador;
      if (P) P.descargarEInstalar({ url: v.apk }).catch(function () { window.open(v.apk, '_system'); }).then(fin);
      else { window.open(v.apk, '_system'); fin(); }
    });
    document.body.appendChild(b);
  }
  window.chequearActualizacion = chequearActualizacion;

  async function pedirPermisoNotificaciones() {
    if (!esApp) return;
    try {
      var LN = window.Capacitor.Plugins.LocalNotifications; if (!LN) return;
      var est = await LN.checkPermissions();
      if (est.display !== 'granted') await LN.requestPermissions();
    } catch (e) { /* no bloquea el arranque */ }
  }

  document.getElementById('main').addEventListener('change', function (e) {
    var c = e.target.closest && e.target.closest('input[data-pid]'); if (!c) return;
    SEL[c.dataset.pid] = c.checked; actualizarTotal();
  });
  document.getElementById('main').addEventListener('click', function (e) {
    var b = e.target.closest('[data-pkg]'); if (!b) return;
    var P = D.plan.presupuesto, ids = b.dataset.pkg === 'todo' ? P.items.map(function (x) { return x.id; }) : P.paquetes[+b.dataset.pkg].ids;
    P.items.forEach(function (it) { SEL[it.id] = ids.indexOf(it.id) >= 0; }); actualizarTotal();
  });

  cargar().then(function (j) {
    D = j;
    document.getElementById('pie').textContent = 'Datos al ' + fmtFecha(D.actualizado);
    var q = new URLSearchParams(location.search);
    mostrar(q.get('s') || 'inicio');
    if (q.get('pdf')) setTimeout(function () { window.print(); }, 400);
    if (q.get('csv')) descargarCSV(actual);
    setTimeout(pedirPermisoNotificaciones, 1500);
    chequearActualizacion();
  }).catch(function () {
    document.getElementById('main').innerHTML = '<p class="estado">No se pudieron cargar los datos. Revisa la conexión e intenta de nuevo.</p>';
  });
})();
</script>
</body>
</html>
